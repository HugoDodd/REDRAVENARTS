<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection Under Curation | Red Raven Arts</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;500;800&display=swap" rel="stylesheet">
    <style>
        .wip-container {
            min-height: 65vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 2rem;
            max-width: 680px;
            margin: 0 auto;
        }

        .wip-subtitle {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: #888;
            margin-bottom: 1.25rem;
            font-weight: 500;
        }

        .wip-title {
            font-size: 2.25rem;
            letter-spacing: -0.02em;
            margin-bottom: 1.5rem;
            line-height: 1.2;
            display: block;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #000;
            margin-bottom: 20px;
        }

        .wip-description {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #555;
            font-weight: 300;
            margin-bottom: 2.5rem;
        }

        .wip-divider {
            width: 40px;
            height: 1px;
            background-color: #e0e0e0;
            border: none;
            margin: 0 auto 2.5rem auto;
        }

        .wip-back-btn {
            display: inline-block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #111;
            text-decoration: none;
            border: 1px solid #111;
            padding: 0.85rem 1.75rem;
            font-weight: 500;
        }

        .wip-btn-text {
            display: inline-block;
            transition: transform 0.25s ease;
        }

        .wip-back-btn:hover .wip-btn-text {
            transform: scale(1.03);
        }
    </style>
</head>
<body class="artist-page">

    <nav class="navbar">
        <div class="breadcrumb">
            <a href="../index.html">Red Raven Arts</a> 
            <span class="sep">/</span> 
            <a href="index.html">Western Collection</a> 
            <span class="sep">/</span>
            <span class="current">Americas & Other Western</span>
        </div>
        <div class="search-wrapper">
            <div class="search-container">
                <input type="text" id="artistSearch" placeholder="Search" onkeyup="filterArtists()">
                <span class="search-icon"></span>
            </div>
            <div id="searchResults" class="search-results-dropdown"></div>
        </div>
    </nav>

    <main>
        <section class="wip-container">
            <span class="wip-subtitle">Collection Update</span>
            <h1 class="wip-title">Americas & Other Western</h1>
            <hr class="wip-divider">
            <p class="wip-description">
                This section is currently under construction.
            </p>
            <a href="index.html" class="wip-back-btn">
                <span class="wip-btn-text">Return to Western Collection</span>
            </a>
        </section>
    </main>

    <footer class="minimal-footer">
        <p>© Red Raven Arts. Private Collection — Not for Sale.</p>
        <a href="index.html">Return to Western Collection</a>
    </footer>

    <script src="../search.js"></script>
</body>
</html>
